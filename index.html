<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capas de color</title>
<style>
:root{--bg:#eceef2;--pn:#fbfbfd;--tx:#14161c;--mu:#6a6f7c;--bd:#dcdfe6;--ac:#3a4bff;--ak:#fff;--r:12px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f13;--pn:#171a21;--tx:#eceef4;--mu:#8e93a1;--bd:#262a34;--ac:#7b88ff;--ak:#0d0f13;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f13;--pn:#171a21;--tx:#eceef4;--mu:#8e93a1;--bd:#262a34;--ac:#7b88ff;--ak:#0d0f13;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 "Avenir Next","Segoe UI Variable","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--pn)}
h1{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0;flex:1}
.btn{border:1px solid var(--bd);background:var(--pn);border-radius:10px;padding:7px 12px;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--ac)}
.btn:disabled{opacity:.4;cursor:default}
.btn.p{background:var(--ac);color:var(--ak);border-color:var(--ac);font-weight:600}
main{flex:1;min-height:0;display:flex}
.stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--stg,#fff);transition:background .2s;position:relative}
canvas#v{max-width:100%;max-height:100%;box-shadow:0 8px 32px rgba(0,0,0,.18);display:none;border-radius:2px}
#empty{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--mu);border-radius:var(--r);padding:36px 28px;text-align:center;cursor:pointer;background:var(--pn);max-width:320px}
#empty b{font-size:16px}#empty span{color:var(--mu)}
aside{width:320px;flex:none;background:var(--pn);border-left:1px solid var(--bd);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
.g>h2{font-size:12px;font-weight:600;color:var(--mu);margin:0 0 6px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:6px 4px;border-radius:8px}
.seg button.on{background:var(--pn);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
.chk{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--mu)}
#list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid var(--bd);border-radius:10px}
.row.off{opacity:.5}
.row canvas{width:44px;height:44px;object-fit:cover;border-radius:6px;background:var(--stg,#fff);flex:none}
.row .m{flex:1;min-width:0}.row .m div{display:flex;align-items:center;gap:6px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--bd)}
.row input[type=range]{width:100%;accent-color:var(--ac)}
.ib{border:0;background:none;padding:4px 6px;border-radius:8px;font-size:15px}
.ib:hover{background:var(--bg)}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{color:var(--mu);font-size:12px}
@media(max-width:820px){main{flex-direction:column}.stage{flex:none;height:46dvh}aside{width:100%;flex:1;border-left:0;border-top:1px solid var(--bd)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
 <h1>Capas de color</h1>
 <label class="btn p" tabindex="0">Subir imagen<input id="f" type="file" accept="image/*" hidden></label>
 <button class="btn" id="th" aria-label="Cambiar tema">◐</button>
</header>
<main>
 <section class="stage" id="st">
  <label id="empty" for="f"><b>Suelta una imagen aquí</b><span>o toca para elegir una foto</span></label>
  <canvas id="v"></canvas>
 </section>
 <aside>
  <div class="g"><h2>Separación</h2><div class="seg" id="sm"></div></div>
  <div class="g"><h2>Fondo del lienzo</h2><div class="seg" id="sb"></div>
   <input type="color" id="cc" value="#f1e7b0" aria-label="Color del papel" style="display:none;width:100%;height:38px;margin-top:8px;border:1px solid var(--bd);border-radius:10px;background:var(--pn);padding:3px">
   <label class="chk" id="wl"><input type="checkbox" id="wc"> Corrección con blanco (aclara lo que el papel no alcanza)</label></div>
  <div class="g"><h2>Capas</h2><div id="list"></div><p class="hint" id="hint">Sube una imagen para empezar.</p></div>
  <div class="g"><h2>Exportar</h2><div class="ex">
   <button class="btn" data-x="png">PNG</button><button class="btn" data-x="pngs">PNG por capa</button>
   <button class="btn" data-x="pdf">PDF</button><button class="btn" data-x="psd">PSD con capas</button></div></div>
 </aside>
</main>
<script>
"use strict";
/* ---------- Estado y utilidades ---------- */
const $=s=>document.querySelector(s),MODES=[['off','Off'],['rgb','RGB'],['cmyk','YMCK'],['ryb','YRB']],BGS=[['#ffffff','Blanco'],['#808080','Gris'],['#000000','Negro'],['custom','Otro']];
const S={mode:'off',bg:0,custom:'#f1e7b0',white:false,W:0,H:0,src:null,img:null,layers:[],white_l:null};
const pc=()=>S.bg===3?S.custom:BGS[S.bg][0],paper=()=>[1,3,5].map(i=>parseInt(pc().slice(i,i+2),16)/255);
const view=$('#v'),ctx=view.getContext('2d');
const cat=a=>{let n=0;for(const x of a)n+=x.length;const o=new Uint8Array(n);let p=0;for(const x of a){o.set(x,p);p+=x.length}return o};
function save(name,blob){
 if(window.AB){const r=new FileReader();r.onload=()=>AB.save(name,blob.type||'application/octet-stream',r.result.split(',')[1]);r.readAsDataURL(blob)}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
}
const toBlob=(cv,t='image/png',q)=>new Promise(r=>cv.toBlob(r,t,q));

/* ---------- Descomposición (estrategia por modo) ---------- */
/* Modelo: resultado = papel · Π transmitancia(capa). Cada capa es una tinta/pigmento que filtra el papel.
   Lo más claro que el papel solo se alcanza con la capa de blanco (opcional). */
function inv(m){const k=m.length,a=m.map((r,i)=>[...r,...Array.from({length:k},(_,j)=>+(i===j))]);for(let i=0;i<k;i++){let p=i;for(let r=i+1;r<k;r++)if(Math.abs(a[r][i])>Math.abs(a[p][i]))p=r;[a[i],a[p]]=[a[p],a[i]];const d=a[i][i];for(let j=0;j<2*k;j++)a[i][j]/=d;for(let r=0;r<k;r++)if(r!==i){const f=a[r][i];for(let j=0;j<2*k;j++)a[r][j]-=f*a[i][j]}}return a.map(r=>r.slice(k))}
const DEF={
 rgb:{n:[['r','Rojo',[255,0,0]],['g','Verde',[0,255,0]],['b','Azul',[0,0,255]]]},
 cmyk:{n:[['y','Amarillo',[255,255,0]],['m','Magenta',[255,0,255]],['c','Cian',[0,255,255]],['k','Negro',[0,0,0]]],f:(r,g,b,o)=>{const k=1-Math.max(r,g,b),d=1-k||1;o[0]=(1-b-k)/d;o[1]=(1-g-k)/d;o[2]=(1-r-k)/d;o[3]=k}},
 ryb:{n:[['y','Amarillo',[255,220,0]],['r','Rojo',[227,38,54]],['b','Azul',[0,90,200]]]}
};
const TR=DEF.ryb.n.map(d=>d[2].map(v=>Math.max(v/255,.03))),MX=TR.map(t=>t.map(v=>-Math.log(v)));
/* Pigmentos tipo Beer–Lambert: ln(transmitancia) es lineal en la cantidad de pintura → mínimos cuadrados no negativos 3×3 */
const SUB=[[0,1,2],[0,1],[0,2],[1,2],[0],[1],[2]].map(s=>{const A=[0,1,2].map(c=>s.map(i=>MX[i][c])),G=s.map((_,a)=>s.map((_,b)=>A.reduce((t,r)=>t+r[a]*r[b],0))),Gi=inv(G);return{s,P:s.map((_,a)=>[0,1,2].map(c=>Gi[a].reduce((t,g,b)=>t+g*A[c][b],0)))}});
function solveRYB(L,o){
 o[0]=o[1]=o[2]=0;let be=1e9,bs=null,ba=null;
 for(const q of SUB){const a=q.P.map(r=>r[0]*L[0]+r[1]*L[1]+r[2]*L[2]);if(a.some(v=>v<0))continue;
  let e=0;for(let c=0;c<3;c++){let t=0;q.s.forEach((i,j)=>t+=MX[i][c]*a[j]);e+=(t-L[c])**2}
  if(e<be-1e-12){be=e;bs=q;ba=a}}
 if(bs)bs.s.forEach((i,j)=>o[i]=Math.min(1,ba[j]));
}
function mkLayer(id,name,col,A,tr){
 const cv=document.createElement('canvas');cv.width=S.W;cv.height=S.H;const x=cv.getContext('2d'),d=x.createImageData(S.W,S.H),p=d.data;
 if(tr){const L=[0,1,2].map(c=>Float32Array.from({length:256},(_,v)=>255*Math.pow(tr[c],v/255)));
  for(let i=0,j=0;i<A.length;i++,j+=4){const v=A[i];p[j]=L[0][v];p[j+1]=L[1][v];p[j+2]=L[2][v];p[j+3]=255}}
 else for(let i=0,j=0;i<A.length;i++,j+=4){p[j]=col[0];p[j+1]=col[1];p[j+2]=col[2];p[j+3]=A[i]}
 x.putImageData(d,0,0);return{id,name,col,A,cv,on:true,op:1,px:tr?p:null};
}
function build(){
 S.layers=[];if(!S.src||S.mode==='off')return;
 const n=S.W*S.H,p=S.src.data,D=DEF[S.mode],k=D.n.length,A=D.n.map(()=>new Uint8ClampedArray(n));
 if(S.mode==='rgb'){for(let i=0;i<n;i++)for(let c=0;c<3;c++)A[c][i]=p[i*4+c]}
 else{
  const P=paper(),W=new Uint8ClampedArray(n),E=[0,0,0],memo=new Map();let any=false,o=new Array(k);
  for(let i=0;i<n;i++){
   let w=0;const T=[p[i*4]/255,p[i*4+1]/255,p[i*4+2]/255];
   if(S.white)for(let c=0;c<3;c++)if(T[c]>P[c]&&P[c]<1)w=Math.max(w,(T[c]-P[c])/(1-P[c]));
   for(let c=0;c<3;c++){const q=P[c]+(1-P[c])*w;E[c]=q>.002?Math.min(1,T[c]/q):1}
   if(w>0){any=true;W[i]=w*255}
   if(S.mode==='cmyk')D.f(E[0],E[1],E[2],o);
   else{const q=E.map(v=>Math.round(v*127)),key=q[0]<<14|q[1]<<7|q[2];o=memo.get(key);
    if(!o){o=[0,0,0];solveRYB(q.map(v=>-Math.log(Math.max(v/127,.003))),o);memo.set(key,o)}}
   for(let c=0;c<k;c++)A[c][i]=o[c]*255;
  }
  if(any)S.layers.push(mkLayer('w','Blanco',[255,255,255],W));
 }
 D.n.forEach((d,c)=>S.layers.push(mkLayer(d[0],d[1],d[2],A[c],S.mode==='ryb'?TR[c]:null)));
}

/* ---------- Composición ---------- */
function render(){
 if(!S.img)return;
 const c=ctx;c.globalAlpha=1;c.globalCompositeOperation='source-over';
 if(S.mode==='off'){c.drawImage(S.img,0,0);return}
 const vis=S.layers.filter(l=>l.on),add=S.mode==='rgb';
 c.fillStyle=add&&vis.length>1?'#000':pc();c.fillRect(0,0,S.W,S.H);
 for(const l of vis){c.globalAlpha=l.op;c.globalCompositeOperation=l.id==='w'?'source-over':add?'lighter':'multiply';c.drawImage(l.cv,0,0)}
 c.globalAlpha=1;c.globalCompositeOperation='source-over';
}
function flat(l){const t=document.createElement('canvas');t.width=S.W;t.height=S.H;const x=t.getContext('2d');x.fillStyle=pc();x.fillRect(0,0,S.W,S.H);x.globalCompositeOperation=l.id==='w'||S.mode==='rgb'?'source-over':'multiply';x.drawImage(l.cv,0,0);return t}

/* ---------- Panel de capas ---------- */
function panel(){
 const L=$('#list');L.innerHTML='';
 $('#hint').textContent=!S.img?'Sube una imagen para empezar.':S.mode==='off'?'Elige RGB, YMCK o YRB para separar.':S.mode==='rgb'?'RGB suma luz: con 2 o más capas la composición usa base negra.':S.mode==='ryb'?'Pigmentos tipo amarillo cadmio, rojo cadmio y azul cobalto: más color en la capa = más pintura. Se mezclan sobre el color del papel.':'Tintas que se multiplican sobre el color del papel. Lo más claro que el papel solo se logra con la capa de blanco.';
 $('#wl').style.display=S.mode==='off'||S.mode==='rgb'?'none':'flex';
 [...S.layers].reverse().forEach(l=>{
  const r=document.createElement('div');r.className='row'+(l.on?'':' off');
  const t=document.createElement('canvas');t.width=44;t.height=44;const x=t.getContext('2d'),s=Math.max(44/S.W,44/S.H);x.fillStyle=pc();x.fillRect(0,0,44,44);x.globalCompositeOperation=l.id==='w'||S.mode==='rgb'?'source-over':'multiply';x.drawImage(l.cv,(44-S.W*s)/2,(44-S.H*s)/2,S.W*s,S.H*s);
  r.innerHTML='<button class="ib" aria-label="Mostrar u ocultar">'+(l.on?'◉':'○')+'</button>';
  r.append(t);
  const m=document.createElement('div');m.className='m';
  m.innerHTML='<div><i class="dot" style="background:rgb('+l.col+')"></i>'+l.name+'</div><input type="range" min="0" max="100" value="'+l.op*100+'" aria-label="Opacidad">';
  r.append(m);
  const so=document.createElement('button');so.className='ib';so.textContent='S';so.title='Solo esta capa';r.append(so);
  r.children[0].onclick=()=>{l.on=!l.on;render();panel()};
  so.onclick=()=>{const only=S.layers.every(q=>q.on===(q===l));S.layers.forEach(q=>q.on=only||q===l);render();panel()};
  m.querySelector('input').oninput=e=>{l.op=e.target.value/100;render()};
  L.append(r);
 });
 document.querySelectorAll('[data-x]').forEach(b=>b.disabled=!S.img||(b.dataset.x!=='png'&&!S.layers.length));
}
function stage(){const c=pc();$('#st').style.setProperty('--stg',c);document.documentElement.style.setProperty('--stg',c)}
function refresh(){stage();render();panel()}

/* ---------- Carga de imagen ---------- */
function load(file){
 if(!file||!file.type.startsWith('image/'))return;
 const im=new Image();im.onload=()=>{
  const k=Math.min(1,1400/Math.max(im.width,im.height));S.W=Math.round(im.width*k);S.H=Math.round(im.height*k);
  const t=document.createElement('canvas');t.width=S.W;t.height=S.H;const x=t.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,S.W,S.H);
  S.img=t;S.src=x.getImageData(0,0,S.W,S.H);S.white_l=null;view.width=S.W;view.height=S.H;
  view.style.display='block';$('#empty').style.display='none';URL.revokeObjectURL(im.src);
  build();refresh();
 };im.src=URL.createObjectURL(file);
}

/* ---------- Exportadores (PNG, PDF, PSD) ---------- */
const exporters={
 async png(){save('composicion.png',await toBlob(view))},
 async pngs(){for(const l of S.layers){save('capa-'+l.name.toLowerCase()+'.png',await toBlob(l.cv));await new Promise(r=>setTimeout(r,350))}},
 async pdf(){
  const pages=[view,...S.layers.map(flat)],P=[],off=[];let len=0;
  const add=x=>{const b=typeof x==='string'?new TextEncoder().encode(x):x;P.push(b);len+=b.length};
  const N=pages.length,jp=[];
  for(const c of pages){const u=c.toDataURL('image/jpeg',.92).split(',')[1],b=atob(u),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);jp.push(a)}
  const o=(n,fn)=>{off[n]=len;add(n+' 0 obj\n');fn();add('\nendobj\n')};
  add('%PDF-1.4\n');
  o(1,()=>add('<</Type/Catalog/Pages 2 0 R>>'));
  o(2,()=>add('<</Type/Pages/Count '+N+'/Kids['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+']>>'));
  pages.forEach((_,i)=>{const b=3+i*3,ct='q '+S.W+' 0 0 '+S.H+' 0 0 cm /I Do Q';
   o(b,()=>add('<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+S.W+' '+S.H+']/Contents '+(b+1)+' 0 R/Resources<</XObject<</I '+(b+2)+' 0 R>>>>>>'));
   o(b+1,()=>add('<</Length '+ct.length+'>>\nstream\n'+ct+'\nendstream'));
   o(b+2,()=>{add('<</Type/XObject/Subtype/Image/Width '+S.W+'/Height '+S.H+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jp[i].length+'>>\nstream\n');add(jp[i]);add('\nendstream')});
  });
  const xr=len,T=3+N*3;add('xref\n0 '+T+'\n0000000000 65535 f \n');
  for(let i=1;i<T;i++)add(String(off[i]).padStart(10,'0')+' 00000 n \n');
  add('trailer\n<</Size '+T+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
  save('capas.pdf',new Blob([cat(P)],{type:'application/pdf'}));
 },
 async psd(){
  const w=S.W,h=S.H,n=w*h,u16=v=>[v>>8&255,v&255],u32=v=>[v>>>24,v>>16&255,v>>8&255,v&255],recs=[],data=[];
  for(const l of S.layers){
   const nm=l.name.slice(0,31),nb=[nm.length,...[...nm].map(c=>c.charCodeAt(0)&127)];while(nb.length%4)nb.push(0);
   const key=l.id==='w'?'norm':S.mode==='rgb'?'lddg':'mul ';
   const r=[...u32(0),...u32(0),...u32(h),...u32(w),...u16(4)];
   for(const id of [0,1,2,0xFFFF])r.push(...u16(id),...u32(2+n));
   r.push(...[...'8BIM'+key].map(c=>c.charCodeAt(0)),Math.round(l.op*255),0,l.on?0:2,0,...u32(8+nb.length),...u32(0),...u32(0),...nb);
   recs.push(new Uint8Array(r));
   for(let c=0;c<3;c++){const d=new Uint8Array(2+n);if(l.px){for(let i=0;i<n;i++)d[2+i]=l.px[i*4+c]}else d.fill(l.col[c]);d[0]=d[1]=0;data.push(d)}
   const a=new Uint8Array(2+n);if(l.px)a.fill(255);else a.set(l.A,2);a[0]=a[1]=0;data.push(a);
  }
  let li=2+recs.reduce((s,x)=>s+x.length,0)+data.reduce((s,x)=>s+x.length,0);const pad=li%2;li+=pad;
  const px=ctx.getImageData(0,0,w,h).data,m=new Uint8Array(2+3*n);
  for(let i=0;i<n;i++){m[2+i]=px[i*4];m[2+n+i]=px[i*4+1];m[2+2*n+i]=px[i*4+2]}
  const head=new Uint8Array([...'8BPS'].map(c=>c.charCodeAt(0)).concat(u16(1),[0,0,0,0,0,0],u16(3),u32(h),u32(w),u16(8),u16(3),u32(0),u32(0),u32(4+li+4),u32(li),u16(S.layers.length)));
  save('capas.psd',new Blob([cat([head,...recs,...data,new Uint8Array(pad),new Uint8Array(4),m])],{type:'image/vnd.adobe.photoshop'}));
 }
};

/* ---------- UI ---------- */
function seg(id,items,get,set){
 const box=$(id);items.forEach((it,i)=>{const b=document.createElement('button');b.textContent=it[1];b.onclick=()=>{set(i,it[0]);mark()};box.append(b)});
 const mark=()=>[...box.children].forEach((b,i)=>b.classList.toggle('on',items[i][0]===get()||i===get()&&typeof get()==='number'));mark();
}
let tm;const rebuild=()=>{stage();clearTimeout(tm);tm=setTimeout(()=>{build();refresh()},20)};
seg('#sm',MODES,()=>S.mode,(i,v)=>{S.mode=v;rebuild()});
seg('#sb',BGS,()=>S.bg,i=>{S.bg=i;$('#cc').style.display=i===3?'block':'none';if(i===2&&!S.white){S.white=true;$('#wc').checked=true}rebuild()});
$('#cc').oninput=e=>{S.custom=e.target.value;rebuild()};
$('#wc').onchange=e=>{S.white=e.target.checked;rebuild()};
$('#f').onchange=e=>load(e.target.files[0]);
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>exporters[b.dataset.x]());
$('#th').onclick=()=>{const r=document.documentElement,d=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';r.dataset.theme=d?'light':'dark'};
['dragover','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();if(t==='drop')load(e.dataTransfer.files[0])}));
stage();panel();
</script>
</body>
</html>
